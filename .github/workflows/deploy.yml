name: Build and deploy cytopia-gate1

on:
  repository_dispatch:
    types: [deploy]
  workflow_dispatch:
    inputs:
      repo:
        description: Private source repository
        required: false
        default: Infinity-light/cytopia-gate1
      ref:
        description: Source branch, tag, or commit
        required: false
        default: main

concurrency:
  group: deploy-cytopia-gate1-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test-build-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      SOURCE_REPO: ${{ github.event.client_payload.repo || inputs.repo || 'Infinity-light/cytopia-gate1' }}
      SOURCE_REF: ${{ github.event.client_payload.ref || inputs.ref || 'main' }}
      EXPECTED_SOURCE_SHA: ${{ github.event.client_payload.source_sha || '' }}
      STUDENT_DOMAIN_POOL: >-
        app01.apps.summercamp.godpenai.com,app02.apps.summercamp.godpenai.com,app03.apps.summercamp.godpenai.com,app04.apps.summercamp.godpenai.com,app05.apps.summercamp.godpenai.com,app06.apps.summercamp.godpenai.com,app07.apps.summercamp.godpenai.com,app08.apps.summercamp.godpenai.com,app09.apps.summercamp.godpenai.com,app10.apps.summercamp.godpenai.com,app11.apps.summercamp.godpenai.com,app12.apps.summercamp.godpenai.com,app13.apps.summercamp.godpenai.com,app14.apps.summercamp.godpenai.com,app15.apps.summercamp.godpenai.com,app16.apps.summercamp.godpenai.com,app17.apps.summercamp.godpenai.com,app18.apps.summercamp.godpenai.com,app19.apps.summercamp.godpenai.com,app20.apps.summercamp.godpenai.com,app21.apps.summercamp.godpenai.com,app22.apps.summercamp.godpenai.com,app23.apps.summercamp.godpenai.com,app24.apps.summercamp.godpenai.com,app25.apps.summercamp.godpenai.com,app26.apps.summercamp.godpenai.com,app27.apps.summercamp.godpenai.com,app28.apps.summercamp.godpenai.com,app29.apps.summercamp.godpenai.com,app30.apps.summercamp.godpenai.com
    steps:
      - name: Check out private source
        uses: actions/checkout@v4
        with:
          repository: ${{ env.SOURCE_REPO }}
          ref: ${{ env.SOURCE_REF }}
          token: ${{ secrets.GH_RELEASE_REPO_TOKEN }}
          fetch-depth: 1

      - name: Pin and verify source revision
        shell: bash
        run: |
          source_sha=$(git rev-parse HEAD)
          if [ -n "$EXPECTED_SOURCE_SHA" ] && [ "$source_sha" != "$EXPECTED_SOURCE_SHA" ]; then
            echo "Checked out $source_sha, expected $EXPECTED_SOURCE_SHA"
            exit 1
          fi
          echo "SOURCE_SHA=$source_sha" >> "$GITHUB_ENV"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install test dependencies
        run: |
          pip install -r requirements-dev.txt
          pip install --index-url https://pypi.org/simple pip-audit
          python -m playwright install --with-deps chromium

      - name: Audit production dependencies
        run: python -m pip_audit -r requirements.txt --index-url https://pypi.org/simple

      - name: Compile and test
        run: |
          python -m compileall backend scripts
          pytest -q
          git diff --check

      - name: Build control-plane and runner images
        run: |
          docker build -t "cytopia-gate1:$SOURCE_SHA" .
          docker build -f runner/Dockerfile -t "cytopia-runner:$SOURCE_SHA" .

      - name: Full-stack runner smoke test with build-only dependency
        run: |
          set -euo pipefail
          project_id=cccccccccccccccccccccccccccccccc
          release_id=dddddddddddddddddddddddddddddddd
          fixture="$RUNNER_TEMP/cytopia-runner-smoke"
          network=cytopia-runner-smoke
          cleanup() {
            docker rm -f "cytopia-app-$release_id" cytopia-runner-smoke 2>/dev/null || true
            docker image rm "cytopia-student:$release_id" 2>/dev/null || true
            docker network rm "$network" 2>/dev/null || true
          }
          trap cleanup EXIT
          mkdir -p "$fixture/releases/$release_id" "$fixture/state"
          cat > "$fixture/releases/$release_id/package.json" <<'JSON'
          {
            "name": "cytopia-runner-smoke",
            "version": "1.0.0",
            "scripts": {
              "build": "node build.js",
              "start": "node server.js"
            },
            "devDependencies": {
              "left-pad": "1.3.0"
            }
          }
          JSON
          cat > "$fixture/releases/$release_id/build.js" <<'JS'
          const leftPad = require("left-pad");
          if (leftPad("ok", 4, "0") !== "00ok") process.exit(1);
          JS
          cat > "$fixture/releases/$release_id/server.js" <<'JS'
          require("http").createServer((request, response) => {
            response.writeHead(request.url === "/health" ? 200 : 404);
            response.end(request.url === "/health" ? "ok" : "not found");
          }).listen(Number(process.env.PORT || 8080), "0.0.0.0");
          JS
          docker network create "$network"
          docker run -d --name cytopia-runner-smoke -p 8021:8020 \
            --network "$network" \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$fixture/releases:/deployments/releases" \
            -v "$fixture/state:/state" \
            -e DEPLOYMENT_RUNNER_TOKEN=smoke-token \
            -e RUNTIME_NETWORK="$network" \
            "cytopia-runner:$SOURCE_SHA"
          for attempt in 1 2 3 4 5; do
            curl -fsS http://127.0.0.1:8021/health >/dev/null && break
            [ "$attempt" = 5 ] && { docker logs cytopia-runner-smoke; exit 1; }
            sleep 2
          done
          response=$(curl -sS -X POST http://127.0.0.1:8021/v1/releases \
            -w $'\n%{http_code}' \
            -H 'Authorization: Bearer smoke-token' \
            -H 'Content-Type: application/json' \
            --data "{\"project_id\":\"$project_id\",\"release_id\":\"$release_id\",\"preset\":\"node\",\"database\":\"none\",\"entrypoint\":\"server.js\",\"healthcheck\":\"/health\"}")
          status=${response##*$'\n'}
          body=${response%$'\n'*}
          echo "$body"
          if [ "$status" -lt 200 ] || [ "$status" -ge 300 ]; then
            docker logs cytopia-runner-smoke
            exit 1
          fi
          docker exec cytopia-runner-smoke python -c \
            "import httpx; response=httpx.get('http://cytopia-app-$release_id:8080/health'); assert response.status_code == 200"

      - name: Container smoke test with persistent mounts
        run: |
          mkdir -p "$RUNNER_TEMP/cytopia-data" "$RUNNER_TEMP/cytopia-uploads"
          chmod 777 "$RUNNER_TEMP/cytopia-data" "$RUNNER_TEMP/cytopia-uploads"
          docker run -d --name cytopia-smoke -p 8010:8010 \
            -v "$RUNNER_TEMP/cytopia-data:/app/data" \
            -v "$RUNNER_TEMP/cytopia-uploads:/app/uploads" \
            -e PUBLIC_BASE_URL=http://127.0.0.1:8010 \
            -e COOKIE_SECURE=false \
            "cytopia-gate1:$SOURCE_SHA"
          for route in /health /summercamp/ /apply/ /prework/ /api/showcase; do
            for attempt in 1 2 3 4 5; do
              code=$(curl -sS -o /dev/null -w '%{http_code}' "http://127.0.0.1:8010$route" || true)
              [ "$code" -ge 200 ] && [ "$code" -lt 400 ] && break
              [ "$attempt" = 5 ] && { docker logs cytopia-smoke; exit 1; }
              sleep 3
            done
          done
          docker rm -f cytopia-smoke

      - name: Package images
        run: docker save "cytopia-gate1:$SOURCE_SHA" "cytopia-runner:$SOURCE_SHA" | gzip > images.tar.gz

      - name: Transfer images and compose topology
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          port: ${{ secrets.SERVER_PORT || '22' }}
          password: ${{ secrets.SERVER_PASSWORD }}
          timeout: 300s
          command_timeout: 25m
          source: images.tar.gz,docker-compose.yml
          target: /tmp

      - name: Deploy with backup and rollback
        uses: appleboy/ssh-action@v1
        env:
          SOURCE_SHA: ${{ env.SOURCE_SHA }}
          STUDENT_DOMAIN_POOL: ${{ env.STUDENT_DOMAIN_POOL }}
          AI_GATEWAY_BASE_URL: ${{ secrets.AI_GATEWAY_BASE_URL }}
          AI_GATEWAY_API_KEY: ${{ secrets.AI_GATEWAY_API_KEY }}
          OSS_ENDPOINT: ${{ vars.OSS_ENDPOINT }}
          OSS_BUCKET: ${{ vars.OSS_BUCKET }}
          OSS_ACCESS_KEY_ID: ${{ secrets.OSS_ACCESS_KEY_ID }}
          OSS_ACCESS_KEY_SECRET: ${{ secrets.OSS_ACCESS_KEY_SECRET }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          port: ${{ secrets.SERVER_PORT || '22' }}
          password: ${{ secrets.SERVER_PASSWORD }}
          timeout: 300s
          command_timeout: 25m
          envs: SOURCE_SHA,STUDENT_DOMAIN_POOL,AI_GATEWAY_BASE_URL,AI_GATEWAY_API_KEY,OSS_ENDPOINT,OSS_BUCKET,OSS_ACCESS_KEY_ID,OSS_ACCESS_KEY_SECRET
          script: |
            set -eu
            APP=/opt/apps/cytopia-gate1
            mkdir -p "$APP/data/deployments" "$APP/data/runner" "$APP/uploads" "$APP/backups"
            chown -R 10001:10001 "$APP/data" "$APP/uploads"
            umask 077
            storage_backend=local
            if [ -n "$OSS_ENDPOINT" ] && [ -n "$OSS_BUCKET" ] && \
               [ -n "$OSS_ACCESS_KEY_ID" ] && [ -n "$OSS_ACCESS_KEY_SECRET" ]; then
              storage_backend=oss
            fi
            {
              printf 'DEPLOYMENT_BASE_DOMAIN=%s\n' 'apps.summercamp.godpenai.com'
              printf 'DEPLOYMENT_DOMAIN_POOL=%s\n' "$STUDENT_DOMAIN_POOL"
              printf 'DEPLOYMENT_DISABLED_HOSTNAMES=%s\n' 'app07.apps.summercamp.godpenai.com'
              printf 'AI_GATEWAY_BASE_URL=%s\n' "$AI_GATEWAY_BASE_URL"
              printf 'AI_GATEWAY_API_KEY=%s\n' "$AI_GATEWAY_API_KEY"
              printf 'AI_GATEWAY_MODEL=%s\n' 'DeepSeek-V3.2'
              printf 'AI_GATEWAY_DAILY_LIMIT=%s\n' '100'
              printf 'CYTOPIA_STORAGE_BACKEND=%s\n' "$storage_backend"
              printf 'OSS_ENDPOINT=%s\n' "$OSS_ENDPOINT"
              printf 'OSS_BUCKET=%s\n' "$OSS_BUCKET"
              printf 'OSS_ACCESS_KEY_ID=%s\n' "$OSS_ACCESS_KEY_ID"
              printf 'OSS_ACCESS_KEY_SECRET=%s\n' "$OSS_ACCESS_KEY_SECRET"
            } > "$APP/runtime.env"
            docker load < /tmp/images.tar.gz
            rm -f /tmp/images.tar.gz
            cp /tmp/docker-compose.yml "$APP/docker-compose.yml"
            rm -f /tmp/docker-compose.yml
            docker tag "cytopia-gate1:$SOURCE_SHA" cytopia-gate1:candidate
            docker tag "cytopia-runner:$SOURCE_SHA" cytopia-runner:candidate
            touch "$APP/.env"
            chmod 600 "$APP/.env"
            ensure_secret() {
              key="$1"
              if ! grep -q "^${key}=" "$APP/.env"; then
                printf '%s=%s\n' "$key" "$(openssl rand -hex 32)" >> "$APP/.env"
              fi
            }
            ensure_secret DEPLOYMENT_RUNNER_TOKEN
            ensure_secret DEPLOYMENT_MYSQL_ROOT_PASSWORD
            ensure_secret DEPLOYMENT_POSTGRES_PASSWORD
            grep -q '^PUBLIC_BASE_URL=' "$APP/.env" || printf '%s\n' 'PUBLIC_BASE_URL=https://summercamp.godpenai.com' >> "$APP/.env"
            grep -q '^COOKIE_SECURE=' "$APP/.env" || printf '%s\n' 'COOKIE_SECURE=true' >> "$APP/.env"
            docker rm -f cytopia-gate1-previous 2>/dev/null || true
            docker rm -f cytopia-runner-previous 2>/dev/null || true
            deploy_complete=0
            rollback() {
              [ "$deploy_complete" = 1 ] && return
              echo "Deployment failed; restoring previous containers"
              docker rm -f cytopia-gate1 2>/dev/null || true
              docker rm -f cytopia-runner 2>/dev/null || true
              if docker inspect cytopia-gate1-previous >/dev/null 2>&1; then
                docker rename cytopia-gate1-previous cytopia-gate1
                docker start cytopia-gate1
              fi
              if docker inspect cytopia-runner-previous >/dev/null 2>&1; then
                docker rename cytopia-runner-previous cytopia-runner
                docker start cytopia-runner
              fi
            }
            trap rollback EXIT
            if docker inspect cytopia-gate1 >/dev/null 2>&1; then
              docker rename cytopia-gate1 cytopia-gate1-previous 2>/dev/null || true
              docker stop cytopia-gate1-previous 2>/dev/null || true
            fi
            if docker inspect cytopia-runner >/dev/null 2>&1; then
              docker rename cytopia-runner cytopia-runner-previous 2>/dev/null || true
              docker stop cytopia-runner-previous 2>/dev/null || true
            fi
            if [ -f "$APP/data/cytopia.sqlite3" ]; then
              cp "$APP/data/cytopia.sqlite3" "$APP/backups/cytopia-$(date +%Y%m%d-%H%M%S).sqlite3"
            fi
            cd "$APP"
            set -a
            . "$APP/runtime.env"
            set +a
            export CYTOPIA_IMAGE_TAG=candidate
            export APP_COMMIT_SHA="$SOURCE_SHA"
            docker compose up -d --no-build
            if [ "$CYTOPIA_STORAGE_BACKEND" = oss ]; then
              docker compose exec -T cytopia-gate1 python scripts/migrate_uploads_to_oss.py
            fi
            passed=0
            for route in /health /summercamp/ /apply/ /prework/ /api/showcase; do
              route_ok=0
              for attempt in 1 2 3 4 5 6; do
                code=$(curl -sS -o /dev/null -w '%{http_code}' "http://127.0.0.1:8010$route" || true)
                if [ "$code" -ge 200 ] && [ "$code" -lt 400 ]; then route_ok=1; break; fi
                sleep 5
              done
              if [ "$route_ok" != 1 ]; then passed=1; break; fi
            done
            if [ "$passed" != 0 ]; then
              docker logs cytopia-gate1 --tail 100 || true
              exit 1
            fi
            disabled_site_code=$(curl -sS -o /tmp/cytopia-disabled-site.json \
              -w '%{http_code}' \
              -H 'Host: app07.apps.summercamp.godpenai.com' \
              http://127.0.0.1:8010/ || true)
            if [ "$disabled_site_code" != 410 ] || \
              ! grep -q '"site_disabled"' /tmp/cytopia-disabled-site.json; then
              echo "Disabled site verification failed (HTTP $disabled_site_code)"
              docker logs cytopia-gate1 --tail 100 || true
              exit 1
            fi
            rm -f /tmp/cytopia-disabled-site.json
            initial_restarts=$(docker inspect cytopia-gate1 --format '{{.RestartCount}}')
            if [ "$initial_restarts" != 0 ]; then
              echo "Container restarted during boot check: $initial_restarts"
              docker logs cytopia-gate1 --tail 100 || true
              exit 1
            fi
            echo "Observing runtime stability for 60 seconds"
            sleep 60
            stable_restarts=$(docker inspect cytopia-gate1 --format '{{.RestartCount}}')
            stable_health=$(curl -sS http://127.0.0.1:8010/health || true)
            if [ "$stable_restarts" != 0 ] || ! printf '%s' "$stable_health" | grep -q '"status":"ok"'; then
              echo "Container failed stability check (restarts=$stable_restarts)"
              docker logs cytopia-gate1 --tail 100 || true
              exit 1
            fi
            deploy_complete=1
            trap - EXIT
            docker rm -f cytopia-gate1-previous 2>/dev/null || true
            docker rm -f cytopia-runner-previous 2>/dev/null || true
            docker tag cytopia-gate1:candidate cytopia-gate1:latest
            docker tag cytopia-runner:candidate cytopia-runner:latest
            find "$APP/backups" -type f -name 'cytopia-*.sqlite3' -mtime +14 -delete
            docker image prune -f

      - name: Configure HTTPS gateway for student deployment domains
        uses: appleboy/ssh-action@v1
        env:
          STUDENT_DOMAIN_POOL: ${{ env.STUDENT_DOMAIN_POOL }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          port: ${{ secrets.SERVER_PORT || '22' }}
          password: ${{ secrets.SERVER_PASSWORD }}
          timeout: 300s
          command_timeout: 20m
          envs: STUDENT_DOMAIN_POOL
          script: |
            set -eu
            APP=/opt/apps/cytopia-gate1
            NGINX=/www/server/nginx/sbin/nginx
            NGINX_MAIN=/www/server/nginx/conf/nginx.conf
            VHOST=/www/server/panel/vhost/nginx/cytopia-student-sites.conf
            CERT="$APP/letsencrypt/live/summercamp.godpenai.com/fullchain.pem"
            DOMAIN_NAMES=$(printf '%s' "$STUDENT_DOMAIN_POOL" | tr ',' ' ')
            FIRST_DOMAIN=$(printf '%s' "$STUDENT_DOMAIN_POOL" | cut -d, -f1)
            LAST_DOMAIN=$(printf '%s' "$STUDENT_DOMAIN_POOL" | awk -F, '{print $NF}')
            mkdir -p "$APP/acme-webroot" "$APP/letsencrypt"
            if [ -f "$VHOST" ]; then
              cp "$VHOST" "$VHOST.before-student-deploy"
              HAD_VHOST=1
            else
              HAD_VHOST=0
            fi
            restore_gateway() {
              if [ "$HAD_VHOST" = 1 ]; then
                mv "$VHOST.before-student-deploy" "$VHOST"
              else
                rm -f "$VHOST"
              fi
              "$NGINX" -t -c "$NGINX_MAIN" >/dev/null 2>&1 \
                && "$NGINX" -s reload -c "$NGINX_MAIN" || true
            }
            trap restore_gateway EXIT
            cat > "$VHOST" <<'NGINX'
            server {
              listen 80;
              server_name __STUDENT_DOMAINS__;
              location ^~ /.well-known/acme-challenge/ {
                root /opt/apps/cytopia-gate1/acme-webroot;
                default_type text/plain;
              }
              location / {
                return 301 https://$host$request_uri;
              }
            }
            server {
              listen 443 ssl http2;
              server_name __STUDENT_DOMAINS__;
              ssl_certificate /opt/apps/cytopia-gate1/letsencrypt/live/summercamp.godpenai.com/fullchain.pem;
              ssl_certificate_key /opt/apps/cytopia-gate1/letsencrypt/live/summercamp.godpenai.com/privkey.pem;
              ssl_protocols TLSv1.2 TLSv1.3;
              add_header X-Content-Type-Options nosniff always;
              location / {
                proxy_pass http://127.0.0.1:8010;
                proxy_http_version 1.1;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto https;
                proxy_set_header X-Forwarded-Host $host;
              }
            }
            NGINX
            sed -i "s|__STUDENT_DOMAINS__|$DOMAIN_NAMES|g" "$VHOST"
            "$NGINX" -t -c "$NGINX_MAIN"
            "$NGINX" -s reload -c "$NGINX_MAIN"
            dns_ready=0
            for attempt in $(seq 1 30); do
              if getent ahostsv4 "$FIRST_DOMAIN" | awk '{print $1}' | grep -qx '47.101.37.244' \
                && getent ahostsv4 "$LAST_DOMAIN" | awk '{print $1}' | grep -qx '47.101.37.244'; then
                dns_ready=1
                break
              fi
              sleep 20
            done
            if [ "$dns_ready" != 1 ]; then
              echo "Student deployment DNS did not converge in ten minutes"
              exit 1
            fi
            if ! openssl x509 -in "$CERT" -noout -text | grep -Fq "DNS:$LAST_DOMAIN"; then
              DOMAIN_ARGS=""
              for domain in $DOMAIN_NAMES; do
                DOMAIN_ARGS="$DOMAIN_ARGS -d $domain"
              done
              docker pull certbot/certbot:v4.1.1
              # DOMAIN_NAMES is a fixed, repository-controlled list of DNS names.
              # shellcheck disable=SC2086
              docker run --rm \
                -v "$APP/acme-webroot:/var/www/certbot" \
                -v "$APP/letsencrypt:/etc/letsencrypt" \
                certbot/certbot:v4.1.1 certonly \
                --webroot --webroot-path /var/www/certbot \
                --cert-name summercamp.godpenai.com --expand \
                --non-interactive --agree-tos \
                -d summercamp.godpenai.com $DOMAIN_ARGS
            fi
            "$NGINX" -t -c "$NGINX_MAIN"
            "$NGINX" -s reload -c "$NGINX_MAIN"
            code=$(curl --noproxy '*' --resolve "$FIRST_DOMAIN:443:127.0.0.1" \
              -sS -D /tmp/cytopia-student-domain-check.headers \
              -o /tmp/cytopia-student-domain-check.json -w '%{http_code}' \
              "https://$FIRST_DOMAIN/")
            gateway_ok=0
            if [ "$code" = 404 ] && grep -q '"site_not_found"' /tmp/cytopia-student-domain-check.json; then
              gateway_ok=1
            fi
            if [ "$code" = 200 ] && grep -qi '^x-deployment-project:' /tmp/cytopia-student-domain-check.headers; then
              gateway_ok=1
            fi
            if [ "$gateway_ok" != 1 ]; then
              echo "Student HTTPS gateway verification failed (HTTP $code)"
              exit 1
            fi
            rm -f /tmp/cytopia-student-domain-check.json \
              /tmp/cytopia-student-domain-check.headers "$VHOST.before-student-deploy"
            trap - EXIT

      - name: Production E2E
        env:
          BASE_URL: https://summercamp.godpenai.com
          EXPECTED_COMMIT_SHA: ${{ env.SOURCE_SHA }}
          EXPECTED_STORAGE_BACKEND: ${{ vars.OSS_ENDPOINT != '' && vars.OSS_BUCKET != '' && secrets.OSS_ACCESS_KEY_ID != '' && secrets.OSS_ACCESS_KEY_SECRET != '' && 'oss' || 'local' }}
        run: python scripts/production_e2e.py
