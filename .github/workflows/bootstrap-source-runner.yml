name: Bootstrap one-shot source runner

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Start an ephemeral runner for the private source repository
        uses: appleboy/ssh-action@v1
        env:
          SOURCE_RUNNER_REGISTRATION_TOKEN: ${{ secrets.SOURCE_RUNNER_REGISTRATION_TOKEN }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          port: ${{ secrets.SERVER_PORT || '22' }}
          password: ${{ secrets.SERVER_PASSWORD }}
          timeout: 60s
          command_timeout: 5m
          envs: SOURCE_RUNNER_REGISTRATION_TOKEN
          script: |
            set -eu
            RUNNER_DIR=/opt/actions-runner-cytopia-oss
            if [ ! -x "$RUNNER_DIR/bin/Runner.Listener" ]; then
              echo "Prepared runner directory is missing"
              exit 2
            fi
            cd "$RUNNER_DIR"
            docker rm -f cytopia-oss-bootstrap-runner 2>/dev/null || true
            docker run -d \
              --name cytopia-oss-bootstrap-runner \
              --user root \
              -e RUNNER_ALLOW_RUNASROOT=1 \
              -e SOURCE_RUNNER_REGISTRATION_TOKEN \
              -v "$RUNNER_DIR:/runner" \
              -w /runner \
              cytopia-gate1:latest \
              /bin/bash -lc '
                sed -i "s|deb.debian.org|mirrors.aliyun.com|g" /etc/apt/sources.list.d/debian.sources
                apt-get update
                apt-get install -y --no-install-recommends libicu-dev
                ./config.sh \
                  --url https://github.com/Infinity-light/cytopia-gate1 \
                  --token "$SOURCE_RUNNER_REGISTRATION_TOKEN" \
                  --unattended \
                  --ephemeral \
                  --name cytopia-oss-bootstrap \
                  --labels codex-oss-bootstrap \
                  --work _work
                exec ./run.sh'
            for attempt in $(seq 1 30); do
              if docker logs cytopia-oss-bootstrap-runner 2>&1 \
                | grep -q 'Listening for Jobs'; then
                echo "Ephemeral source runner container started"
                exit 0
              fi
              if [ "$(docker inspect cytopia-oss-bootstrap-runner --format '{{.State.Running}}')" != true ]; then
                docker logs cytopia-oss-bootstrap-runner
                exit 1
              fi
              sleep 2
            done
            docker logs cytopia-oss-bootstrap-runner
            exit 1
