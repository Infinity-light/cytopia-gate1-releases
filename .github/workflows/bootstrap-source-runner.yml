name: Bootstrap one-shot source runner

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Download runner on the GitHub-hosted machine
        run: |
          curl -fsSLO \
            https://github.com/actions/runner/releases/download/v2.336.0/actions-runner-linux-x64-2.336.0.tar.gz

      - name: Transfer runner archive
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          port: ${{ secrets.SERVER_PORT || '22' }}
          password: ${{ secrets.SERVER_PASSWORD }}
          timeout: 120s
          command_timeout: 5m
          source: actions-runner-linux-x64-2.336.0.tar.gz
          target: /tmp

      - name: Start an ephemeral runner for the private source repository
        uses: appleboy/ssh-action@v1
        env:
          SOURCE_RUNNER_REGISTRATION_TOKEN: ${{ secrets.SOURCE_RUNNER_REGISTRATION_TOKEN }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          port: ${{ secrets.SERVER_PORT || '22' }}
          password: ${{ secrets.SERVER_PASSWORD }}
          timeout: 60s
          command_timeout: 5m
          envs: SOURCE_RUNNER_REGISTRATION_TOKEN
          script: |
            set -eu
            RUNNER_DIR=/opt/actions-runner-cytopia-oss
            if [ -e "$RUNNER_DIR" ]; then
              if [ ! -x "$RUNNER_DIR/bin/Runner.Listener" ]; then
                echo "Incomplete runner directory exists; refusing to reuse"
                exit 2
              fi
              rm -f /tmp/actions-runner-linux-x64-2.336.0.tar.gz
            else
              mkdir -p "$RUNNER_DIR"
              cd "$RUNNER_DIR"
              mv /tmp/actions-runner-linux-x64-2.336.0.tar.gz .
              tar xzf actions-runner-linux-x64-2.336.0.tar.gz
              rm -f actions-runner-linux-x64-2.336.0.tar.gz
            fi
            cd "$RUNNER_DIR"
            docker run --rm \
              --user root \
              -e RUNNER_ALLOW_RUNASROOT=1 \
              -e DOTNET_SYSTEM_GLOBALIZATION_INVARIANT=1 \
              -e SOURCE_RUNNER_REGISTRATION_TOKEN \
              -v "$RUNNER_DIR:/runner" \
              -w /runner \
              cytopia-gate1:latest \
              /bin/bash -lc './config.sh \
                --url https://github.com/Infinity-light/cytopia-gate1 \
                --token "$SOURCE_RUNNER_REGISTRATION_TOKEN" \
                --unattended \
                --ephemeral \
                --name cytopia-oss-bootstrap \
                --labels codex-oss-bootstrap \
                --work _work'
            docker run -d \
              --name cytopia-oss-bootstrap-runner \
              --user root \
              -e RUNNER_ALLOW_RUNASROOT=1 \
              -e DOTNET_SYSTEM_GLOBALIZATION_INVARIANT=1 \
              -v "$RUNNER_DIR:/runner" \
              -w /runner \
              cytopia-gate1:latest \
              /bin/bash -lc './run.sh'
            echo "Ephemeral source runner container started"
