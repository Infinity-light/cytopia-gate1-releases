name: Cleanup interrupted blackbox test deployments

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Back up database and remove exact interrupted test records
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          port: ${{ secrets.SERVER_PORT || '22' }}
          password: ${{ secrets.SERVER_PASSWORD }}
          timeout: 300s
          command_timeout: 8m
          script: |
            set -eu
            APP=/opt/apps/cytopia-gate1
            DB="$APP/data/cytopia.sqlite3"
            test -f "$DB"
            mkdir -p "$APP/backups"
            BACKUP="$APP/backups/cytopia-blackbox-cleanup-$(date +%Y%m%d-%H%M%S).sqlite3"
            cp "$DB" "$BACKUP"
            docker exec -i cytopia-gate1 python - <<'PY'
            import json
            import re
            import shutil
            import sqlite3
            from pathlib import Path

            targets = {
                "app01.apps.summercamp.godpenai.com": "BLACKBOX_V1",
                "app02.apps.summercamp.godpenai.com": "BLACKBOX_SECOND_CANDIDATE",
            }
            database = Path("/app/data/cytopia.sqlite3")
            releases_root = Path("/app/data/deployments/releases").resolve()
            connection = sqlite3.connect(database, timeout=30)
            connection.row_factory = sqlite3.Row
            connection.execute("PRAGMA foreign_keys=ON")
            placeholders = ",".join("?" for _ in targets)
            rows = connection.execute(
                f"""
                SELECT p.id AS project_id,p.hostname,p.current_release_id,
                       p.owner_registration_id,p.team_id,
                       r.user_id,u.username,t.name AS team_name
                FROM deploy_projects p
                JOIN registrations r ON r.id=p.owner_registration_id
                JOIN user_accounts u ON u.id=r.user_id
                LEFT JOIN teams t ON t.id=p.team_id
                WHERE p.hostname IN ({placeholders})
                ORDER BY p.hostname
                """,
                tuple(targets),
            ).fetchall()
            found = {row["hostname"] for row in rows}
            if found != set(targets):
                raise SystemExit(f"cleanup target mismatch: {sorted(found)}")
            release_ids = []
            for row in rows:
                if not row["username"].startswith("bb-"):
                    raise SystemExit(f"refusing non-blackbox account on {row['hostname']}")
                if not (row["team_name"] or "").startswith("黑盒测试组-"):
                    raise SystemExit(f"refusing non-blackbox team on {row['hostname']}")
                release_file = (
                    releases_root / row["current_release_id"] / "index.html"
                ).resolve()
                if not release_file.is_relative_to(releases_root):
                    raise SystemExit("release path escaped deployment root")
                content = release_file.read_text(encoding="utf-8")
                if targets[row["hostname"]] not in content:
                    raise SystemExit(f"marker mismatch on {row['hostname']}")
                release_ids.extend(
                    item["id"]
                    for item in connection.execute(
                        "SELECT id FROM deploy_releases WHERE project_id=?",
                        (row["project_id"],),
                    ).fetchall()
                )
            team_ids = sorted({row["team_id"] for row in rows if row["team_id"]})
            registration_ids = sorted({row["owner_registration_id"] for row in rows})
            user_ids = sorted({row["user_id"] for row in rows})
            try:
                connection.execute("BEGIN IMMEDIATE")
                for team_id in team_ids:
                    connection.execute("DELETE FROM teams WHERE id=?", (team_id,))
                for registration_id in registration_ids:
                    connection.execute(
                        "DELETE FROM registrations WHERE id=?", (registration_id,)
                    )
                for user_id in user_ids:
                    connection.execute("DELETE FROM user_accounts WHERE id=?", (user_id,))
                remaining = connection.execute(
                    f"SELECT COUNT(*) FROM deploy_projects WHERE hostname IN ({placeholders})",
                    tuple(targets),
                ).fetchone()[0]
                if remaining:
                    raise RuntimeError("target projects remain after cleanup")
                connection.commit()
            except Exception:
                connection.rollback()
                raise
            finally:
                connection.close()
            removed_directories = 0
            for release_id in release_ids:
                if not re.fullmatch(r"[0-9a-f]{32}", release_id):
                    continue
                release_path = (releases_root / release_id).resolve()
                if release_path.is_relative_to(releases_root) and release_path.is_dir():
                    shutil.rmtree(release_path)
                    removed_directories += 1
            print(
                json.dumps(
                    {
                        "removed_hosts": sorted(targets),
                        "removed_projects": len(rows),
                        "removed_release_directories": removed_directories,
                    }
                )
            )
            PY
            echo "Recoverable database backup: $BACKUP"
